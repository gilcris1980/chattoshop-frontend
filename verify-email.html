<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- HEADER -->
            <div class="text-center mb-8">

                <a href="./index.html" class="text-3xl font-bold text-indigo-600">
                    ChattoShop
                </a>

                <p class="text-gray-600 mt-2">
                    Email Verification
                </p>

            </div>

            <!-- LOADING STATE -->
            <div id="loading-state" class="text-center py-8">

                <i class="fas fa-spinner fa-spin text-4xl text-indigo-600 mb-4"></i>

                <p class="text-gray-600">Loading...</p>

            </div>

            <!-- VERIFY FORM -->
            <div id="verify-form" class="hidden">

                <p id="verify-message" class="hidden text-center text-sm text-red-600 mb-4 font-medium"></p>

                <form id="otp-form" class="space-y-4">

                    <div>

                        <label class="block text-gray-700 font-medium mb-2">
                            Email Address
                        </label>

                        <input type="email"
                            id="email"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                            placeholder="your@email.com">

                    </div>

                    <div>

                        <label class="block text-gray-700 font-medium mb-2">
                            OTP Code
                        </label>

                        <input type="text"
                            id="otp"
                            required
                            maxlength="6"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center text-xl tracking-widest"
                            placeholder="123456">

                    </div>

                    <button type="submit"
                        id="submit-btn"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">

                        Verify Email

                    </button>

                </form>

                <div class="text-center mt-4">

                    <button
                        id="resend-btn"
                        class="text-indigo-600 hover:text-indigo-800 font-medium text-sm">

                        <i class="fas fa-paper-plane mr-1"></i>

                        Resend OTP

                    </button>

                    <p id="resend-message" class="text-sm mt-2 hidden"></p>

                </div>

                <div class="mt-6 text-center">

                    <a href="./login.html" onclick="localStorage.removeItem('token'); localStorage.removeItem('user');" class="text-gray-500 hover:text-gray-700 text-sm">

                        <i class="fas fa-arrow-left mr-1"></i>

                        Back to Login

                    </a>

                </div>

            </div>

            <!-- SUCCESS STATE -->
            <div id="success-state" class="hidden text-center py-8">

                <div class="w-16 h-16 mx-auto mb-4 bg-green-100 rounded-full flex items-center justify-center">

                    <i class="fas fa-check-circle text-3xl text-green-600"></i>

                </div>

                <h2 class="text-2xl font-bold text-gray-800 mb-2">Email Verified!</h2>

                <p class="text-gray-600 mb-6">
                    Your email has been successfully verified. You can now log in.
                </p>

                <a href="./login.html" onclick="localStorage.removeItem('token'); localStorage.removeItem('user');"
                    class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">

                    <i class="fas fa-sign-in-alt mr-2"></i>

                    Go to Login

                </a>

            </div>

            <!-- ERROR STATE -->
            <div id="error-state" class="hidden text-center py-8">

                <div class="w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full flex items-center justify-center">

                    <i class="fas fa-exclamation-triangle text-3xl text-red-600"></i>

                </div>

                <h2 class="text-2xl font-bold text-gray-800 mb-2">Verification Failed</h2>

                <p id="error-message" class="text-gray-600 mb-6">
                    The verification link is invalid or expired.
                </p>

                <p class="text-gray-500 text-sm mb-4">
                    Please log in to request a new OTP code.
                </p>

                <a href="./login.html" onclick="localStorage.removeItem('token'); localStorage.removeItem('user');"
                    class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">

                    <i class="fas fa-sign-in-alt mr-2"></i>

                    Go to Login

                </a>

            </div>

        </div>

        <!-- TOAST -->
        <div id="toast" class="hidden fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>

    </div>

    <script src="./js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const params = new URLSearchParams(window.location.search);

            const loadingState = document.getElementById('loading-state');
            const verifyForm = document.getElementById('verify-form');
            const successState = document.getElementById('success-state');
            const errorState = document.getElementById('error-state');
            const errorMessage = document.getElementById('error-message');
            const resendBtn = document.getElementById('resend-btn');
            const resendMessage = document.getElementById('resend-message');

            const emailInput = document.getElementById('email');
            const otpInput = document.getElementById('otp');
            const submitBtn = document.getElementById('submit-btn');
            const form = document.getElementById('otp-form');

            const savedEmail = sessionStorage.getItem('verify_email') || params.get('email') || '';
            const user = api.getUser();

            if (user && user.email) {
                emailInput.value = user.email;
                emailInput.readOnly = true;
            } else if (savedEmail) {
                emailInput.value = savedEmail;
            }

            const verifyMessage = sessionStorage.getItem('verify_message');
            if (verifyMessage) {
                const msgEl = document.getElementById('verify-message');
                if (msgEl) {
                    msgEl.textContent = verifyMessage;
                    msgEl.classList.remove('hidden');
                }
                sessionStorage.removeItem('verify_message');
            }

            loadingState.classList.add('hidden');
            verifyForm.classList.remove('hidden');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Verifying...';

                const email = emailInput.value.trim();
                const otp = otpInput.value.trim();

                if (!email || !otp) {
                    showToast('Please enter your email and OTP code.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Verify Email';
                    return;
                }

                try {
                    await api.post('/verify-email', { email, otp });

                    sessionStorage.removeItem('verify_email');

                    verifyForm.classList.add('hidden');
                    successState.classList.remove('hidden');

                } catch (error) {
                    const msg = error.data?.message || error.message || 'Verification failed';
                    showToast(msg, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Verify Email';
                }
            });

            if (resendBtn) {
                resendBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    if (!email) {
                        showToast('Please enter your email first.', 'error');
                        return;
                    }

                    resendBtn.disabled = true;
                    resendBtn.innerHTML = 'Sending...';
                    resendMessage.classList.add('hidden');

                    try {
                        await api.post('/resend-verification-otp', { email });

                        resendMessage.textContent = 'OTP sent! Check your email inbox.';
                        resendMessage.className = 'text-sm mt-4 text-green-600';

                    } catch (error) {
                        let msg = error.data?.message || error.message || 'Failed to resend OTP';
                        if (error.status === 429) {
                            msg = 'Too many resend requests. Please wait a minute before requesting another OTP.';
                        }

                        resendMessage.textContent = msg;
                        resendMessage.className = 'text-sm mt-4 text-red-600';

                    } finally {
                        resendBtn.disabled = false;
                        resendBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Resend OTP';
                        resendMessage.classList.remove('hidden');
                    }
                });
            }

            function showToast(message, type) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 4000);
            }

        });
    </script>
</body>
</html>

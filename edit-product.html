<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - ChattoShop Seller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-indigo-600">ChattoShop</a>
                    <span class="ml-2 px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded">Seller</span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-indigo-600 font-medium">Home</a>
                    <a href="products.html" class="text-gray-700 hover:text-indigo-600 font-medium">Products</a>
                    <a href="seller-products.html" class="text-gray-700 hover:text-indigo-600 font-medium">My Products</a>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <button id="user-menu-btn" class="flex items-center space-x-2 hover:bg-gray-100 rounded-lg px-3 py-2 transition">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="w-8 h-8 rounded-full">
                            <span id="user-name" class="font-medium text-gray-700">User</span>
                            <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                        <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-full md:w-64 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50">
                            <div class="px-4 py-3 border-b">
                                <p id="dropdown-user-name" class="font-medium text-gray-800">User Name</p>
                                <p id="dropdown-user-email" class="text-sm text-gray-500">user@email.com</p>
                            </div>
                            <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50"><i class="fas fa-user mr-2"></i> Profile</a>
                            <a id="my-orders-link" href="orders.html" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50"><i class="fas fa-shopping-bag mr-2"></i> My Orders</a>
                            <a href="seller-products.html" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50"><i class="fas fa-box mr-2"></i> My Products</a>
                            <a href="seller-dashboard.html" class="block px-4 py-2 text-blue-600 hover:bg-blue-50"><i class="fas fa-store mr-2"></i> Seller Dashboard</a>
                            <button onclick="logout()" class="block w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 border-t border-gray-100 mt-1 pt-1">
                                <i class="fas fa-sign-out-alt mr-2"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <h1 class="text-2xl font-bold text-gray-800">Edit Product</h1>
                <a href="seller-products.html" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </a>
            </div>

            <form id="product-form" class="p-6 space-y-6">
                <!-- Current Image -->
                <div class="flex items-center space-x-4">
                    <div id="current-image" class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center overflow-hidden">
                        <i class="fas fa-image text-3xl text-gray-400"></i>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 mb-1">Current Image</p>
                        <p class="text-xs text-gray-400">Leave empty to keep current image</p>
                    </div>
                </div>

                <!-- New Image -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Change Image</label>
                    <input type="file" id="image" accept="image/*"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <p class="text-xs text-gray-500 mt-1">Max 2MB. Leave empty to keep current.</p>
                </div>

                <!-- Image Preview -->
                <div id="image-preview" class="hidden w-32 h-32 bg-gray-200 rounded-lg flex items-center justify-center overflow-hidden border-2 border-indigo-300">
                    <img id="preview-img" src="" alt="Preview" class="w-full h-full object-cover">
                </div>

                <!-- Product Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Name *</label>
                    <input type="text" id="name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                        placeholder="Enter product name">
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="category_id"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">Select Category</option>
                    </select>
                </div>

                <!-- Price & Stock -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price (₱) *</label>
                        <input type="number" id="price" step="0.01" min="0" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                            placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Stock *</label>
                        <input type="number" id="stock" min="0" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                            placeholder="0">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="description" rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                        placeholder="Enter product description"></textarea>
                </div>

                <!-- Status -->
                <div>
                    <label class="flex items-center">
                        <input type="checkbox" id="status" checked class="w-5 h-5 text-indigo-600 rounded">
                        <span class="ml-2 text-sm font-medium text-gray-700">Active (visible to customers)</span>
                    </label>
                </div>

                <!-- Buttons -->
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <a href="seller-products.html" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-100">
                        Cancel
                    </a>
                    <button type="submit" id="submit-btn"
                        class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                        <i class="fas fa-save mr-2"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let productId = null;
        let currentImageUrl = null;
        let dropdownOpen = false;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = api.getUser();
            const token = api.getToken();

            if (!user || !token) {
                window.location.href = 'login.html';
                return;
            }

            if (
                     user.role !== 'seller' &&
                     user.role !== 'system_admin' &&
                     user.role !== 'admin'
                        ) {
                     window.location.href = 'dashboard.html';
                    return;
              }
            
            if (user.role === 'seller' && user.seller_status === 'pending') {
                showToast('Your seller account is awaiting administrator approval.', 'error');
                setTimeout(() => { window.location.href = 'seller-dashboard.html'; }, 2000);
                return;
            }

            document.getElementById('user-name').textContent = user.name || 'User';
            document.getElementById('dropdown-user-name').textContent = user.name || 'User';
            document.getElementById('dropdown-user-email').textContent = user.email || '';
            if (user.avatar) {
                document.getElementById('user-avatar').src = api.getStorageUrl(user.avatar);
            }

            setupDropdown();
            document.getElementById('my-orders-link')?.classList.add('hidden');
            await loadCategories();

            const urlParams = new URLSearchParams(window.location.search);
            productId = urlParams.get('id');

            if (!productId) {
                showToast('Product ID is required', 'error');
                setTimeout(() => { window.location.href = 'seller-products.html'; }, 1500);
                return;
            }

            await loadProduct();
        });

        function setupDropdown() {
            document.getElementById('user-menu-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownOpen = !dropdownOpen;
                document.getElementById('user-dropdown').classList.toggle('hidden', !dropdownOpen);
            });

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('user-dropdown');
                const btn = document.getElementById('user-menu-btn');
                if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdownOpen = false;
                    dropdown.classList.add('hidden');
                }
            });
        }

        async function loadCategories() {
            try {
                const data = await api.get('/categories?status=1');
                const categories = data.data || data;

                const select = document.getElementById('category_id');
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadProduct() {
            try {
                const product = await api.get('/products/' + productId);

                document.getElementById('name').value = product.name || '';
                document.getElementById('category_id').value = product.category_id || '';
                document.getElementById('price').value = product.price || '';
                document.getElementById('stock').value = product.stock || '';
                document.getElementById('description').value = product.description || '';
                document.getElementById('status').checked = product.status == 1;

                if (product.image) {
                    currentImageUrl = api.getStorageUrl(product.image);
                    document.getElementById('current-image').innerHTML =
                        '<img src="' + currentImageUrl + '" alt="' + product.name + '" class="w-full h-full object-cover">';
                }

                document.title = 'Edit: ' + product.name + ' - ChattoShop Seller';
            } catch (error) {
                showToast('Failed to load product', 'error');
                setTimeout(() => { window.location.href = 'seller-products.html'; }, 1500);
            }
        }

        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    showToast('Image must be less than 2MB', 'error');
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('image-preview');
                    document.getElementById('preview-img').src = event.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('image-preview').classList.add('hidden');
            }
        });

        document.getElementById('product-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving...';

            const name = document.getElementById('name').value.trim();
            const category_id = document.getElementById('category_id').value;
            const price = document.getElementById('price').value;
            const stock = document.getElementById('stock').value;
            const description = document.getElementById('description').value.trim();
            const status = document.getElementById('status').checked ? 1 : 0;

            if (!name || !price || stock === '') {
                showToast('Please fill in all required fields', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Changes';
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('category_id', category_id || '');
            formData.append('price', price);
            formData.append('stock', stock);
            formData.append('description', description);
            formData.append('status', status);

            const imageInput = document.getElementById('image');
            if (imageInput.files.length > 0) {
                formData.append('image', imageInput.files[0]);
            }

            try {
                await api.upload('/products/' + productId, formData, 'PUT');
                showToast('Product updated successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'seller-products.html';
                }, 1500);
            } catch (error) {
                showToast(error.message || 'Failed to update product', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i> Save Changes';
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ' + (type === 'success' ? 'bg-green-500' : 'bg-red-500');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function logout() {
            api.removeToken();
            api.removeUser();
            localStorage.removeItem('cart');
            window.location.href = 'index.html';
        }

        window.logout = logout;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChattoShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- HEADER -->
            <div class="text-center mb-8">

                <a href="./index.html"
                    class="text-3xl font-bold text-indigo-600">
                    ChattoShop
                </a>

                <p class="text-gray-600 mt-2">
                    Welcome back! Please login to your account
                </p>

            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="space-y-6">

                <!-- EMAIL -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        Email Address
                    </label>

                    <div class="relative">

                        <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                            placeholder="your@email.com">

                    </div>

                    <p id="email-error"
                        class="text-red-500 text-sm mt-1 hidden">
                    </p>

                </div>

                <!-- PASSWORD -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                            placeholder="Enter password">

                        <button
                            type="button"
                            id="toggle-password"
                            class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">

                            <i id="eye-icon" class="fas fa-eye"></i>

                        </button>

                    </div>

                    <p id="password-error"
                        class="text-red-500 text-sm mt-1 hidden">
                    </p>

                </div>

                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">

                    Login

                </button>

            </form>

            <!-- REGISTER -->
            <div class="mt-6 text-center">

                <p class="text-gray-600">

                    Don't have an account?

                    <a href="./register.html"
                        class="text-indigo-600 hover:text-indigo-800 font-medium">

                        Sign Up

                    </a>

                </p>

            </div>

            <!-- BACK -->
            <div class="mt-4 text-center">

                <a href="./index.html"
                    id="back-home-btn"
                    class="text-gray-500 hover:text-gray-700">

                    <i class="fas fa-arrow-left mr-1"></i>

                    Back to Home

                </a>

            </div>

        </div>

        <!-- TOAST -->
        <div
            id="toast"
            class="hidden fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50">
        </div>

    </div>

    <!-- API -->
    <script src="./js/api.js"></script>

    <!-- LOGIN -->
    <script src="./js/login.js"></script>

</body>
</html>

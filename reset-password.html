<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- HEADER -->
            <div class="text-center mb-8">

                <a href="./index.html" class="text-3xl font-bold text-indigo-600">
                    ChattoShop
                </a>

                <p class="text-gray-600 mt-2">
                    Reset your password
                </p>

                <p class="text-sm text-gray-500 mt-1">
                    Choose a new password for your account.
                </p>

            </div>

            <!-- HIDDEN FIELDS -->
            <input type="hidden" id="token" value="">
            <input type="hidden" id="email" value="">

            <!-- RESET PASSWORD FORM -->
            <form id="reset-password-form" class="space-y-6">

                <!-- NEW PASSWORD -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        New Password
                    </label>

                    <div class="relative">

                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                            placeholder="Min. 8 characters">

                        <button
                            type="button"
                            id="toggle-password"
                            class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">

                            <i id="eye-icon" class="fas fa-eye"></i>

                        </button>

                    </div>

                    <p id="password-error" class="text-red-500 text-sm mt-1 hidden"></p>

                </div>

                <!-- CONFIRM PASSWORD -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        Confirm New Password
                    </label>

                    <div class="relative">

                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>

                        <input
                            type="password"
                            id="password-confirmation"
                            name="password_confirmation"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                            placeholder="Re-enter new password">

                    </div>

                    <p id="password-confirmation-error" class="text-red-500 text-sm mt-1 hidden"></p>

                </div>

                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">

                    Reset Password

                </button>

            </form>

            <!-- SUCCESS MESSAGE -->
            <div id="success-message" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">

                <div class="flex items-center">

                    <i class="fas fa-check-circle text-green-500 text-xl mr-3"></i>

                    <div>

                        <p class="text-green-800 font-medium">Password reset successful!</p>

                        <p class="text-green-600 text-sm mt-1">
                            You will be redirected to login...
                        </p>

                    </div>

                </div>

            </div>

            <!-- BACK TO LOGIN -->
            <div class="mt-6 text-center">

                <a href="./login.html"
                    class="text-indigo-600 hover:text-indigo-800 font-medium">

                    <i class="fas fa-arrow-left mr-1"></i>

                    Back to Login

                </a>

            </div>

        </div>

        <!-- TOAST -->
        <div id="toast" class="hidden fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>

    </div>

    <script src="./js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // =========================
            // GET TOKEN AND EMAIL FROM URL
            // =========================

            const params = new URLSearchParams(window.location.search);

            const token = params.get('token');
            const email = params.get('email');

            if (!token || !email) {

                showToast('Invalid reset link', 'error');

                setTimeout(() => {

                    window.location.href = './forgot-password.html';

                }, 3000);

                return;

            }

            document.getElementById('token').value = token;
            document.getElementById('email').value = email;

            // =========================
            // PASSWORD TOGGLE
            // =========================

            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');

            if (togglePasswordBtn) {

                togglePasswordBtn.addEventListener('click', () => {

                    if (passwordInput.type === 'password') {

                        passwordInput.type = 'text';
                        eyeIcon.classList.remove('fa-eye');
                        eyeIcon.classList.add('fa-eye-slash');

                    } else {

                        passwordInput.type = 'password';
                        eyeIcon.classList.remove('fa-eye-slash');
                        eyeIcon.classList.add('fa-eye');

                    }

                });

            }

            // =========================
            // FORM SUBMIT
            // =========================

            const form = document.getElementById('reset-password-form');
            const passwordError = document.getElementById('password-error');
            const passwordConfirmError = document.getElementById('password-confirmation-error');
            const submitBtn = document.getElementById('submit-btn');
            const successMessage = document.getElementById('success-message');

            form.addEventListener('submit', async (e) => {

                e.preventDefault();

                passwordError.classList.add('hidden');
                passwordConfirmError.classList.add('hidden');
                successMessage.classList.add('hidden');

                const password = document.getElementById('password').value.trim();
                const passwordConfirmation = document.getElementById('password-confirmation').value.trim();

                if (!password || password.length < 8) {

                    passwordError.textContent = 'Password must be at least 8 characters';
                    passwordError.classList.remove('hidden');
                    return;

                }

                if (password !== passwordConfirmation) {

                    passwordConfirmError.textContent = 'Passwords do not match';
                    passwordConfirmError.classList.remove('hidden');
                    return;

                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Resetting...';

                try {

                    const data = await api.post('/reset-password', {
                        email: email,
                        token: token,
                        password: password,
                        password_confirmation: passwordConfirmation,
                    });

                    form.classList.add('hidden');
                    successMessage.classList.remove('hidden');

                    setTimeout(() => {

                        window.location.href = './login.html';

                    }, 3000);

                } catch (error) {

                    const msg = error.data?.message || error.data?.errors?.email?.[0] || error.message || 'Failed to reset password';

                    passwordError.textContent = msg;
                    passwordError.classList.remove('hidden');

                } finally {

                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Reset Password';

                }

            });

            // =========================
            // TOAST
            // =========================

            function showToast(message, type) {

                const toast = document.getElementById('toast');

                toast.textContent = message;
                toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
                toast.classList.remove('hidden');

                setTimeout(() => toast.classList.add('hidden'), 4000);

            }

        });
    </script>
</body>
</html>

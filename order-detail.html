<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-indigo-600">ChattoShop</a>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <button id="user-menu-btn" class="flex items-center space-x-2 hover:bg-gray-100 rounded-lg px-3 py-2 transition">
                            <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="w-8 h-8 rounded-full">
                            <span id="user-name" class="font-medium text-gray-700">User</span>
                            <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                        <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-xl border border-gray-100 py-2 z-50">
                            <div class="px-4 py-3 border-b">
                                <p id="dropdown-user-name" class="font-medium text-gray-800">User Name</p>
                                <p id="dropdown-user-email" class="text-sm text-gray-500">user@email.com</p>
                            </div>
                            <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50"><i class="fas fa-user mr-2"></i> Profile</a>
                            <a href="orders.html" class="block px-4 py-2 text-gray-700 hover:bg-indigo-50"><i class="fas fa-shopping-bag mr-2"></i> My Orders</a>
                            <button onclick="logout()" class="block w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 border-t border-gray-100 mt-1 pt-1">
                                <i class="fas fa-sign-out-alt mr-2"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-8">

        <div id="toast" class="hidden fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>

        <!-- Loading -->
        <div id="loading" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-indigo-600"></i>
        </div>

        <!-- Error -->
        <div id="error" class="hidden text-center py-12">
            <i class="fas fa-exclamation-circle text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">Order not found</p>
            <a href="orders.html" class="mt-4 inline-block text-indigo-600 hover:text-indigo-800">Back to Orders</a>
        </div>

        <!-- Order Detail -->
        <div id="order-detail" class="hidden">

            <!-- Back Button -->
            <div class="mb-6">
                <a href="orders.html" class="text-gray-600 hover:text-gray-800">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Orders
                </a>
            </div>

            <!-- Order Header Card -->
            <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                <div class="bg-gray-50 px-6 py-4 border-b flex flex-wrap justify-between items-start gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Order #<span id="order-id"></span></h1>
                        <p class="text-sm text-gray-500 mt-1">Placed on <span id="order-date"></span></p>
                    </div>
                    <div class="text-right">
                        <span id="order-status" class="px-4 py-2 rounded-full text-sm font-medium"></span>
                        <p id="order-total" class="text-2xl font-bold text-indigo-600 mt-2"></p>
                    </div>
                </div>
            </div>

            <!-- Seller Info -->
            <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                <div class="px-6 py-4 border-b bg-gray-50">
                    <h3 class="font-semibold text-gray-800"><i class="fas fa-store mr-2 text-indigo-600"></i>Seller</h3>
                </div>
                <div class="px-6 py-4">
                    <p class="text-gray-700" id="seller-info">Loading...</p>
                </div>
            </div>

            <!-- Products -->
            <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                <div class="px-6 py-4 border-b bg-gray-50">
                    <h3 class="font-semibold text-gray-800"><i class="fas fa-box mr-2 text-indigo-600"></i>Products</h3>
                </div>
                <div id="order-items" class="divide-y divide-gray-200">
                    <!-- Items loaded via JS -->
                </div>
                <div class="px-6 py-4 bg-gray-50 border-t">
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-gray-800">Total</span>
                        <span id="order-total-bottom" class="text-xl font-bold text-indigo-600"></span>
                    </div>
                </div>
            </div>

            <!-- Shipping & Payment -->
            <div class="bg-white rounded-lg shadow overflow-hidden mb-6">
                <div class="px-6 py-4 border-b bg-gray-50">
                    <h3 class="font-semibold text-gray-800"><i class="fas fa-truck mr-2 text-indigo-600"></i>Shipping & Payment</h3>
                </div>
                <div class="px-6 py-4 space-y-3">
                    <div class="flex">
                        <span class="text-gray-500 w-32 flex-shrink-0">Shipping Address</span>
                        <span id="order-shipping" class="text-gray-800"></span>
                    </div>
                    <div class="flex">
                        <span class="text-gray-500 w-32 flex-shrink-0">Phone Number</span>
                        <span id="order-phone" class="text-gray-800"></span>
                    </div>
                    <div class="flex">
                        <span class="text-gray-500 w-32 flex-shrink-0">Payment Method</span>
                        <span id="order-payment" class="text-gray-800"></span>
                    </div>
                    <div id="order-notes-row" class="hidden flex">
                        <span class="text-gray-500 w-32 flex-shrink-0">Order Notes</span>
                        <span id="order-notes" class="text-gray-800"></span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div id="order-actions" class="hidden flex gap-4">
                <button id="cancel-btn" onclick="cancelOrder()"
                    class="px-6 py-3 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700">
                    <i class="fas fa-times mr-2"></i>Cancel Order
                </button>
            </div>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let orderId = null;
        let orderData = null;
        let dropdownOpen = false;

        document.addEventListener('DOMContentLoaded', () => {
            const user = api.getUser();
            const token = api.getToken();

            if (!user || !token) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-name').textContent = user.name || 'User';
            document.getElementById('dropdown-user-name').textContent = user.name || 'User';
            document.getElementById('dropdown-user-email').textContent = user.email || '';
            if (user.avatar) {
                document.getElementById('user-avatar').src = api.getStorageUrl(user.avatar);
            }

            setupDropdown();

            const params = new URLSearchParams(window.location.search);
            orderId = params.get('id');

            if (!orderId) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                return;
            }

            loadOrder();
        });

        function setupDropdown() {
            document.getElementById('user-menu-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownOpen = !dropdownOpen;
                document.getElementById('user-dropdown').classList.toggle('hidden', !dropdownOpen);
            });

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('user-dropdown');
                const btn = document.getElementById('user-menu-btn');
                if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdownOpen = false;
                    dropdown.classList.add('hidden');
                }
            });
        }

        async function loadOrder() {
            try {
                const order = await api.get('/orders/' + orderId);
                orderData = order;
                renderOrder(order);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('order-detail').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function getStatusClass(status) {
            const classes = {
                'pending': 'bg-yellow-100 text-yellow-800',
                'processing': 'bg-blue-100 text-blue-800',
                'shipped': 'bg-purple-100 text-purple-800',
                'delivered': 'bg-green-100 text-green-800',
                'completed': 'bg-green-100 text-green-800',
                'cancelled': 'bg-red-100 text-red-800'
            };
            return classes[status] || 'bg-gray-100 text-gray-800';
        }

        function renderOrder(order) {
            const items = order.items || [];

            document.getElementById('order-id').textContent = order.id;
            document.getElementById('order-date').textContent = new Date(order.created_at).toLocaleDateString('en-PH', {
                year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            const statusBadge = document.getElementById('order-status');
            statusBadge.textContent = order.status.charAt(0).toUpperCase() + order.status.slice(1);
            statusBadge.className = 'px-4 py-2 rounded-full text-sm font-medium ' + getStatusClass(order.status);

            document.getElementById('order-total').textContent = api.formatCurrency(order.total_amount);
            document.getElementById('order-total-bottom').textContent = api.formatCurrency(order.total_amount);

            // Seller info — collect unique seller names from items
            const sellerNames = [...new Set(items
                .filter(item => item.product?.seller)
                .map(item => item.product.seller.name)
            )];
            document.getElementById('seller-info').textContent = sellerNames.length > 0
                ? sellerNames.join(', ')
                : 'N/A';

            // Products
            const itemsContainer = document.getElementById('order-items');
            itemsContainer.innerHTML = items.map((item, i) => `
                <div class="px-6 py-4 flex items-center gap-4 ${i === 0 ? '' : ''}">
                    <div class="flex-1">
                        <p class="font-medium text-gray-800">${item.product?.name || 'Product'}</p>
                        <p class="text-sm text-gray-500">Qty: ${item.quantity} x ${api.formatCurrency(item.price)}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-semibold text-gray-800">${api.formatCurrency(parseFloat(item.price) * item.quantity)}</p>
                    </div>
                </div>
            `).join('');

            // Shipping & payment
            document.getElementById('order-shipping').textContent = order.shipping_address || 'N/A';
            document.getElementById('order-phone').textContent = order.user?.phone || 'N/A';
            document.getElementById('order-payment').textContent = (order.payment_method || 'cod').toUpperCase();

            // Notes
            if (order.notes) {
                document.getElementById('order-notes-row').classList.remove('hidden');
                document.getElementById('order-notes').textContent = order.notes;
            }

            // Cancel button — only when pending
            const user = api.getUser();
            if (user && user.role === 'customer' && order.status === 'pending') {
                document.getElementById('order-actions').classList.remove('hidden');
            }
        }

        async function cancelOrder() {
            if (!orderData || orderData.status !== 'pending') return;

            if (!confirm('Are you sure you want to cancel this order?')) return;

            try {
                await api.post('/orders/' + orderId + '/cancel');
                showToast('Order cancelled successfully', 'success');
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            } catch (error) {
                showToast(error.message || 'Failed to cancel order', 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ' + (type === 'success' ? 'bg-green-500' : 'bg-red-500');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function logout() {
            api.removeToken();
            api.removeUser();
            localStorage.removeItem('cart');
            window.location.href = 'index.html';
        }

        window.logout = logout;
    </script>
</body>
</html>

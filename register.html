<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <a href="index.html" class="text-3xl font-bold text-indigo-600">ChattoShop</a>
                <p class="text-gray-600 mt-2">Create your account</p>
            </div>
            
            <form id="register-form" class="space-y-5">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        placeholder="John Doe">
                    <p id="name-error" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        placeholder="your@email.com">
                    <p id="email-error" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        placeholder="��������">
                    <p id="password-error" class="text-red-500 text-sm mt-1 hidden"></p>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Confirm Password</label>
                    <input type="password" id="password_confirmation" name="password_confirmation" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                        placeholder="��������">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Account Type</label>
                    <select id="role" name="role" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                        <option value="customer">Customer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>
                
                <button type="submit" id="submit-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">
                    Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600">Already have an account? <a href="login.html" class="text-indigo-600 hover:text-indigo-800 font-medium">Login</a></p>
            </div>
            
            <div class="mt-4 text-center">
                <a href="index.html" class="text-gray-500 hover:text-gray-700"><i class="fas fa-arrow-left mr-1"></i> Back to Home</a>
            </div>
        </div>
        
        <div id="toast" class="hidden fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirmation = document.getElementById('password_confirmation').value;
            const role = document.getElementById('role').value;
            const submitBtn = document.getElementById('submit-btn');
            
            if (password !== password_confirmation) {
                showToast('Passwords do not match!', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating account...';
            
            clearErrors();
            
            try {
const data = await api.post('/register', {
                    name, email, password, password_confirmation, role
                });
                
                api.setToken(data.token);
                api.setUser(data.user);
                
                showToast('Registration successful! Please verify your email.', 'success');
                setTimeout(() => {
                    window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
                }, 1000);
            } catch (error) {
                if (error.data?.message) {
                    showToast(error.data.message, 'error');
                }
                const errs = error.data?.errors || error.errors;
                if (errs) {
                    Object.keys(errs).forEach(key => {
                        const errorEl = document.getElementById(`${key}-error`);
                        if (errorEl) {
                            errorEl.textContent = errs[key][0];
                            errorEl.classList.remove('hidden');
                        }
                    });
                } else if (!error.data?.message) {
                    showToast(error.message || 'Registration failed. Please try again.', 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
        
        function clearErrors() {
            document.querySelectorAll('[id$="-error"]').forEach(el => el.classList.add('hidden'));
        }
        
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>

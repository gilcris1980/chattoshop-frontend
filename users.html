<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">ChattoShop</a>
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-gray-700 hover:text-indigo-600">Dashboard</a>
                <button onclick="logout()" class="text-red-600">Logout</button>
            </div>
        </div>
    </nav>
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold">User Management</h1>
                <button onclick="showAddModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Add User</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b">
                            <th class="text-left py-3">ID</th>
                            <th class="text-left py-3">Name</th>
                            <th class="text-left py-3">Email</th>
                            <th class="text-left py-3">Role</th>
                            <th class="text-left py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table"></tbody>
                </table>
            </div>
            <div id="pagination" class="mt-4 flex justify-center"></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        let currentPage = 1;
        document.addEventListener('DOMContentLoaded', loadUsers);
        
        async function loadUsers(page = 1) {
            currentPage = page;
            try {
                const data = await api.get(`/users?page=${page}`);
                const users = data.data || data;
                document.getElementById('users-table').innerHTML = users.map(u => `
                    <tr class="border-b">
                        <td class="py-3">${u.id}</td>
                        <td class="py-3">${u.name}</td>
                        <td class="py-3">${u.email}</td>
                        <td class="py-3"><span class="px-2 py-1 rounded text-sm ${u.role === 'super_admin' ? 'bg-purple-100 text-purple-800' : u.role === 'seller' ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">${u.role}</span></td>
                        <td class="py-3">
                            ${u.id !== 1 ? `<button onclick="deleteUser(${u.id})" class="text-red-600 hover:text-red-800">Delete</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (error) { console.error(error); }
        }
        
        function logout() { api.removeToken(); api.removeUser(); window.location.href = 'index.html'; }
    </script>
</body>
</html>

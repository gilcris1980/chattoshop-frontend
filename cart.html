<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-indigo-600">ChattoShop</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-700 hover:text-indigo-600 font-medium">Home</a>
                    <a href="products.html" class="text-gray-700 hover:text-indigo-600 font-medium">Products</a>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="cart-btn" class="relative p-2 text-indigo-600">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Shopping Cart</h1>
        
        <div id="toast" class="hidden fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>
        
        <!-- Seller Warning -->
        <div id="seller-warning" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-lg p-6 mb-6 text-center">
            <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
            <p class="text-lg font-semibold">Sellers cannot purchase products. Please use a customer account.</p>
        </div>
        
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Cart Items -->
            <div class="lg:w-2/3">
                <div id="cart-items" class="space-y-4">
                    <!-- Cart items loaded via JS -->
                </div>
            </div>
            
            <!-- Order Summary -->
            <div id="order-summary" class="lg:w-1/3">
                <div class="bg-white rounded-lg shadow p-6 sticky top-24">
                    <h3 class="font-semibold text-lg mb-4">Order Summary</h3>
                    <div class="space-y-3 mb-4">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Subtotal</span>
                            <span id="cart-subtotal" class="font-semibold">₱0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Shipping</span>
                            <span class="font-semibold text-green-600">Free</span>
                        </div>
                        <div class="border-t pt-3 flex justify-between">
                            <span class="font-semibold">Total</span>
                            <span id="cart-total" class="text-xl font-bold text-indigo-600">₱0.00</span>
                        </div>
                    </div>
                    <button onclick="proceedToCheckout()" id="checkout-btn" disabled
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed">
                        Proceed to Checkout
                    </button>
                    <a href="products.html" class="block text-center mt-4 text-indigo-600 hover:text-indigo-800">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        document.addEventListener('DOMContentLoaded', () => {
            const user = api.getUser();
            if (user && user.role === 'seller') {
                document.getElementById('seller-warning').classList.remove('hidden');
                document.getElementById('cart-items').innerHTML = '';
                document.getElementById('order-summary').innerHTML = '';
                return;
            }
            if (!user || user.role !== 'customer') {
                window.location.href = 'dashboard.html';
                return;
            }
            renderCart();
            updateCartUI();
            document.getElementById('cart-btn').addEventListener('click', () => window.location.href = 'cart.html');
        });
        
        function renderCart() {
            const container = document.getElementById('cart-items');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-shopping-cart text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-lg mb-4">Your cart is empty</p>
                        <a href="products.html" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">Shop Now</a>
                    </div>
                `;
                checkoutBtn.disabled = true;
                updateSummary();
                return;
            }
            
            checkoutBtn.disabled = false;
            
            container.innerHTML = cart.map((item, index) => `
                <div class="bg-white rounded-lg shadow p-4 flex items-center gap-4">
                    <div class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center overflow-hidden flex-shrink-0">
                        ${item.image ? 
                            `<img src="${api.getStorageUrl(item.image)}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.innerHTML='<i class=\\'fas fa-image text-2xl text-gray-400\\'></i>'">` :
                            '<i class="fas fa-image text-2xl text-gray-400"></i>'
                        }
                    </div>
                    <div class="flex-1">
                        <h3 class="font-semibold text-gray-800">${item.name}</h3>
                        <p class="text-indigo-600 font-bold">${api.formatCurrency(item.price)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQuantity(${index}, -1)" class="w-8 h-8 bg-gray-200 rounded hover:bg-gray-300">-</button>
                        <span class="w-8 text-center">${item.quantity}</span>
                        <button onclick="updateQuantity(${index}, 1)" ${item.quantity >= item.stock ? 'disabled' : ''} class="w-8 h-8 rounded ${item.quantity >= item.stock ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-gray-200 hover:bg-gray-300'}">+</button>
                        ${item.quantity >= item.stock ? '<span class="text-xs text-red-500 ml-1">Max</span>' : ''}
                    </div>
                    <div class="text-right">
                        <p class="font-semibold">${api.formatCurrency(item.price * item.quantity)}</p>
                        <button onclick="removeFromCart(${index})" class="text-red-500 text-sm hover:text-red-700">Remove</button>
                    </div>
                </div>
            `).join('');
            
            updateSummary();
        }
        
        function updateQuantity(index, change) {
            const item = cart[index];
            const newQty = item.quantity + change;
            if (newQty < 0) {
                return;
            }
            if (change > 0 && item.stock && newQty > item.stock) {
                showToast('Maximum available stock reached.', 'error');
                return;
            }
            item.quantity = newQty;
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            updateCartUI();
        }
        
        function removeFromCart(index) {
            const itemName = cart[index].name;
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            updateCartUI();
            showToast(`${itemName} removed from cart`, 'success');
        }
        
        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-subtotal').textContent = api.formatCurrency(subtotal);
            document.getElementById('cart-total').textContent = api.formatCurrency(subtotal);
        }
        
        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
            localStorage.setItem('cart', JSON.stringify(cart));
        }
        
        function proceedToCheckout() {
            const user = api.getUser();
            if (!user) {
                showToast('Please login to checkout', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
                return;
            }
            window.location.href = 'checkout.html';
        }
        
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ChattoShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- HEADER -->
            <div class="text-center mb-8">

                <a href="./index.html" class="text-3xl font-bold text-indigo-600">
                    ChattoShop
                </a>

                <p class="text-gray-600 mt-2">
                    Forgot your password? No problem.
                </p>

                <p class="text-sm text-gray-500 mt-1">
                    Enter your email and we'll send you a reset link.
                </p>

            </div>

            <!-- FORGOT PASSWORD FORM -->
            <form id="forgot-password-form" class="space-y-6">

                <!-- EMAIL -->
                <div>

                    <label class="block text-gray-700 font-medium mb-2">
                        Email Address
                    </label>

                    <div class="relative">

                        <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                            placeholder="your@email.com">

                    </div>

                    <p id="email-error" class="text-red-500 text-sm mt-1 hidden"></p>

                </div>

                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200">

                    Send Reset Link

                </button>

            </form>

            <!-- SUCCESS MESSAGE -->
            <div id="success-message" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">

                <div class="flex items-center">

                    <i class="fas fa-check-circle text-green-500 text-xl mr-3"></i>

                    <div>

                        <p class="text-green-800 font-medium">Reset Link Sent!</p>

                        <p class="text-green-600 text-sm mt-1">
                            If an account exists for that email, a password reset link has been sent.
                        </p>

                    </div>

                </div>

            </div>

            <!-- VERIFICATION REQUIRED MESSAGE -->
            <div id="verify-message" class="hidden mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">

                <div class="flex items-center">

                    <i class="fas fa-exclamation-triangle text-yellow-500 text-xl mr-3"></i>

                    <div>

                        <p class="text-yellow-800 font-medium">Please verify your email address before resetting your password.</p>

                        <a id="verify-email-link" href="#" class="inline-block mt-2 text-indigo-600 hover:text-indigo-800 font-medium">

                            <i class="fas fa-envelope mr-1"></i>

                            Verify Email

                        </a>

                    </div>

                </div>

            </div>

            <!-- BACK TO LOGIN -->
            <div class="mt-6 text-center">

                <a href="./login.html"
                    class="text-indigo-600 hover:text-indigo-800 font-medium">

                    <i class="fas fa-arrow-left mr-1"></i>

                    Back to Login

                </a>

            </div>

        </div>

        <!-- TOAST -->
        <div id="toast" class="hidden fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white z-50"></div>

    </div>

    <script src="./js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const form = document.getElementById('forgot-password-form');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('email-error');
            const submitBtn = document.getElementById('submit-btn');
            const successMessage = document.getElementById('success-message');
            const verifyMessage = document.getElementById('verify-message');

            form.addEventListener('submit', async (e) => {

                e.preventDefault();

                emailError.classList.add('hidden');
                successMessage.classList.add('hidden');
                verifyMessage.classList.add('hidden');

                const email = emailInput.value.trim();

                if (!email) {

                    emailError.textContent = 'Please enter your email';
                    emailError.classList.remove('hidden');
                    return;

                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = 'Sending...';

                try {

                    const data = await api.post('/forgot-password', { email }, { skipVerificationRedirect: true });

                    form.classList.add('hidden');
                    successMessage.classList.remove('hidden');

                } catch (error) {

                    let msg = error.data?.errors?.email?.[0] || error.data?.message || error.message || 'Failed to send reset link';

                    if (error.status === 429) {
                        const retryAfter = error.data?.retry_after;
                        msg = retryAfter
                            ? `Too many requests. Please try again in ${retryAfter} seconds.`
                            : 'Too many requests. Please wait before trying again.';
                    }

                    if (error.status === 403 && error.data?.needs_verification) {
                        document.getElementById('verify-email-link').href = 'verify-email.html?email=' + encodeURIComponent(error.data.email || email);
                        verifyMessage.classList.remove('hidden');
                    } else {
                        emailError.textContent = msg;
                        emailError.classList.remove('hidden');
                    }

                } finally {

                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Send Reset Link';

                }

            });

        });
    </script>
</body>
</html>
